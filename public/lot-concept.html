<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>225 Custer — Lot Concept v1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0E0D1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px 24px;
      font-family: 'Courier New', monospace;
      color: #C0B8CC;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: 0.38;
    }
    .frame {
      border: 2px solid #22203A;
      box-shadow:
        0 0 0 1px #2E2C48,
        0 12px 48px rgba(0,0,0,0.7),
        0 2px 8px rgba(0,0,0,0.5);
    }
    .caption {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.22;
    }
  </style>
</head>
<body>

<div class="eyebrow">225 Custer Ave · Colorado Springs · Static Lot Concept v1</div>

<div class="frame">
<!--
  80×80 viewBox displayed at 560px → each viewBox unit = 7px.
  A 2-unit element = 14px display. Thick enough to feel chunky/tiled.
  Orientation: North = top (backyard), South = bottom (street).
  Inspired by Stardew Valley / Animal Crossing map tiles.
  Property is xeriscape (gravel/mulch), not lawn — warm tan palette.
-->
<svg
  viewBox="0 0 80 80"
  width="560" height="560"
  xmlns="http://www.w3.org/2000/svg"
>
<defs>
  <!-- Xeriscape gravel — warm tan with organic pebble variation -->
  <pattern id="gravel" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#C0A46E"/>
    <rect x="1" y="0" width="2" height="1" fill="#B09458" opacity="0.55"/>
    <rect x="3" y="2" width="1" height="2" fill="#CEB87A" opacity="0.45"/>
    <rect x="0" y="3" width="2" height="1" fill="#A88C52" opacity="0.45"/>
    <rect x="2" y="1" width="1" height="2" fill="#D0BC80" opacity="0.35"/>
    <rect x="0" y="1" width="1" height="1" fill="#A88C52" opacity="0.25"/>
  </pattern>

  <!-- Asphalt — cool dark with subtle grain -->
  <pattern id="asphalt" x="0" y="0" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="3" fill="#36363E"/>
    <rect x="0" y="1" width="3" height="1" fill="#40404A" opacity="0.4"/>
    <rect x="1" y="0" width="2" height="1" fill="#2C2C34" opacity="0.3"/>
    <rect x="3" y="2" width="1" height="1" fill="#44444C" opacity="0.3"/>
  </pattern>

  <!-- Concrete — light gray with expansion joint grid -->
  <pattern id="concrete" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#CCCABF"/>
    <rect x="0" y="3" width="6" height="1" fill="#BAB8AC" opacity="0.5"/>
    <rect x="3" y="0" width="1" height="6" fill="#BAB8AC" opacity="0.35"/>
  </pattern>

  <!-- Roof shingles — slate gray with offset rows -->
  <pattern id="shingles" x="0" y="0" width="8" height="4" patternUnits="userSpaceOnUse">
    <rect width="8" height="4" fill="#686876"/>
    <rect x="0" y="0" width="4" height="2" fill="#747484" opacity="0.45"/>
    <rect x="4" y="2" width="4" height="2" fill="#747484" opacity="0.45"/>
    <rect x="0" y="2" width="8" height="1" fill="#565664" opacity="0.4"/>
    <rect x="4" y="0" width="1" height="4" fill="#565664" opacity="0.2"/>
  </pattern>

  <!-- Mulch — dark brown for garden beds -->
  <pattern id="mulch" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="3" fill="#6A4A28"/>
    <rect x="1" y="0" width="2" height="1" fill="#7A5A32" opacity="0.5"/>
    <rect x="0" y="2" width="2" height="1" fill="#583A1C" opacity="0.5"/>
    <rect x="2" y="1" width="1" height="2" fill="#7A5A32" opacity="0.35"/>
  </pattern>
</defs>

<!-- ================================================================
     CONTEXT: NEIGHBORS & STREET (muted, so lot stays focal)
     ================================================================ -->

<!-- Back alley / rear neighbor property -->
<rect x="0" y="0" width="80" height="8" fill="#423D52"/>
<!-- Neighbor structure hints — roof shapes, de-saturated -->
<rect x="8"  y="1" width="22" height="6" fill="#504A60" rx="0"/>
<rect x="38" y="2" width="14" height="5" fill="#504A60" rx="0"/>
<rect x="58" y="1" width="12" height="5" fill="#4A4558" rx="0"/>
<!-- Alley/lane dark strip -->
<rect x="0" y="7" width="80" height="2" fill="#2C2A38" opacity="0.7"/>

<!-- Left neighbor lot -->
<rect x="0" y="9" width="7" height="62" fill="#524C5E"/>
<!-- Left neighbor structure -->
<rect x="1" y="14" width="5" height="10" fill="#5E5870" rx="0"/>
<rect x="1" y="26" width="5" height="6"  fill="#5E5870" rx="0" opacity="0.6"/>

<!-- Right neighbor lot -->
<rect x="73" y="9" width="7" height="62" fill="#524C5E"/>
<!-- Right neighbor structure -->
<rect x="74" y="16" width="5" height="8" fill="#5E5870" rx="0"/>

<!-- Street (asphalt) -->
<rect x="0" y="73" width="80" height="7" fill="url(#asphalt)"/>
<!-- Dashed center line -->
<rect x="0"  y="76" width="9"  height="1" fill="#F0DC60" opacity="0.35"/>
<rect x="13" y="76" width="9"  height="1" fill="#F0DC60" opacity="0.35"/>
<rect x="26" y="76" width="9"  height="1" fill="#F0DC60" opacity="0.35"/>
<rect x="39" y="76" width="9"  height="1" fill="#F0DC60" opacity="0.35"/>
<rect x="52" y="76" width="9"  height="1" fill="#F0DC60" opacity="0.35"/>
<rect x="65" y="76" width="9"  height="1" fill="#F0DC60" opacity="0.35"/>

<!-- Curb -->
<rect x="0" y="71" width="80" height="2" fill="#ACA8A0"/>
<!-- Sidewalk -->
<rect x="0" y="68" width="80" height="3" fill="#C4C0B6"/>
<!-- Sidewalk expansion joints -->
<rect x="20" y="68" width="1" height="3" fill="#B4B0A6" opacity="0.6"/>
<rect x="40" y="68" width="1" height="3" fill="#B4B0A6" opacity="0.6"/>
<rect x="60" y="68" width="1" height="3" fill="#B4B0A6" opacity="0.6"/>

<!-- ================================================================
     THE LOT
     ================================================================ -->

<!-- Main lot ground — xeriscape gravel -->
<rect x="7" y="9" width="66" height="59" fill="url(#gravel)"/>

<!-- Lot boundary fences -->
<rect x="7"  y="9"  width="66" height="1" fill="#8A6A3C" opacity="0.9"/><!-- back -->
<rect x="7"  y="9"  width="1"  height="59" fill="#8A6A3C" opacity="0.9"/><!-- left -->
<rect x="72" y="9"  width="1"  height="59" fill="#8A6A3C" opacity="0.9"/><!-- right -->
<!-- Fence post caps (every ~10 units) -->
<rect x="7"  y="9"  width="2" height="2" fill="#9A7A4A"/>
<rect x="7"  y="38" width="2" height="2" fill="#9A7A4A"/>
<rect x="7"  y="67" width="2" height="2" fill="#9A7A4A"/>
<rect x="72" y="9"  width="2" height="2" fill="#9A7A4A"/>
<rect x="72" y="38" width="2" height="2" fill="#9A7A4A"/>
<rect x="72" y="67" width="2" height="2" fill="#9A7A4A"/>
<rect x="36" y="9"  width="2" height="2" fill="#9A7A4A"/>

<!-- ================================================================
     BACKYARD FEATURES (north / top of image)
     ================================================================ -->

<!-- Back garden mulch beds -->
<rect x="8"  y="11" width="16" height="6" fill="url(#mulch)" opacity="0.75"/>
<rect x="30" y="10" width="16" height="4" fill="url(#mulch)" opacity="0.65"/>

<!-- Back patio (northeast — concrete pavers) -->
<rect x="59" y="11" width="13" height="13" fill="url(#concrete)"/>
<!-- Patio border / edge shadow -->
<rect x="59" y="11" width="13" height="1" fill="#AEACA0"/>
<rect x="59" y="11" width="1"  height="13" fill="#AEACA0"/>
<!-- Patio outer shadow (south + east faces, isometric feel) -->
<rect x="59" y="23" width="13" height="1" fill="#968E80" opacity="0.6"/>
<rect x="71" y="11" width="1"  height="13" fill="#968E80" opacity="0.4"/>

<!-- Patio umbrella (closed/down, circle is the canopy from above) -->
<circle cx="65" cy="16" r="4" fill="#1A4A4A" opacity="0.95"/>
<circle cx="65" cy="16" r="3" fill="#1E5858"/>
<circle cx="65" cy="16" r="2" fill="#246464"/>
<circle cx="64" cy="15" r="1" fill="#2A7070" opacity="0.7"/><!-- highlight -->
<!-- Umbrella pole -->
<rect x="64" y="13" width="1" height="6" fill="#0C2424"/>
<!-- Table + chairs suggestion -->
<rect x="63" y="20" width="4" height="3" fill="#8A8070" opacity="0.7"/>
<rect x="61" y="19" width="2" height="2" fill="#7A7060" opacity="0.5"/>
<rect x="67" y="19" width="2" height="2" fill="#7A7060" opacity="0.5"/>
<rect x="61" y="22" width="2" height="2" fill="#7A7060" opacity="0.5"/>
<rect x="67" y="22" width="2" height="2" fill="#7A7060" opacity="0.5"/>

<!-- ================================================================
     PATHS
     ================================================================ -->

<!-- East side path — runs along right side of house north→south -->
<rect x="59" y="24" width="5" height="34" fill="url(#concrete)"/>
<!-- The path continues north to connect to back patio -->
<rect x="59" y="11" width="5" height="13" fill="url(#concrete)"/>
<!-- (The patio and north path share x=59-64, so they connect seamlessly) -->

<!-- Path edge shadow lines -->
<rect x="59" y="24" width="1" height="34" fill="#AEAC9E" opacity="0.5"/>
<rect x="63" y="24" width="1" height="34" fill="#AEAC9E" opacity="0.4"/>

<!-- GATE opening in right fence (gap at ~y=36-44) -->
<!-- The right fence has a break here — represented by a lighter fill -->
<rect x="72" y="37" width="1" height="8" fill="#B4B0A6"/>
<!-- Gate posts (chunky wood posts) -->
<rect x="71" y="36" width="2" height="2" fill="#7A5A2E"/>
<rect x="71" y="44" width="2" height="2" fill="#7A5A2E"/>

<!-- Main front path — street to front door, center of lot -->
<rect x="37" y="55" width="7" height="13" fill="url(#concrete)"/>
<!-- Path edge lines -->
<rect x="37" y="55" width="1" height="13" fill="#AEAC9E" opacity="0.55"/>
<rect x="43" y="55" width="1" height="13" fill="#AEAC9E" opacity="0.45"/>

<!-- ================================================================
     TREES & VEGETATION
     ================================================================ -->

<!-- ── BIG FRONT-LEFT TREE (dominant — matches aerial photo) ──
     Large mature deciduous, spring leafy, canopy ~16 units across -->
<!-- Ground shadow, cast south-east by overhead light -->
<ellipse cx="20" cy="48" rx="10" ry="5" fill="#5C4820" opacity="0.18"/>
<!-- Trunk — just a hint below the canopy -->
<rect x="18" y="44" width="3" height="4" fill="#7A5A28"/>
<rect x="19" y="43" width="2" height="2" fill="#6A4A1E"/>
<!-- Canopy: layered circles, dark at base, bright at top = depth -->
<!-- Deepest shadow / canopy floor -->
<circle cx="19" cy="40" r="9" fill="#1E4410"/>
<!-- Mid canopy mass -->
<circle cx="16" cy="38" r="6" fill="#2A5A18"/>
<circle cx="22" cy="39" r="6" fill="#2A5A18"/>
<circle cx="19" cy="36" r="7" fill="#326618"/>
<!-- Upper lit canopy -->
<circle cx="15" cy="34" r="5" fill="#3E7A20"/>
<circle cx="23" cy="35" r="5" fill="#3E7A20"/>
<circle cx="19" cy="32" r="6" fill="#4A8A26"/>
<!-- Top-of-canopy highlights (catching direct light) -->
<circle cx="16" cy="30" r="4" fill="#5A9E30"/>
<circle cx="22" cy="31" r="4" fill="#5A9E30"/>
<circle cx="19" cy="29" r="4" fill="#6AB038"/>
<!-- Brightest highlight cluster -->
<circle cx="18" cy="27" r="3" fill="#7CC044"/>
<circle cx="21" cy="28" r="3" fill="#7CC044"/>
<circle cx="19" cy="26" r="2" fill="#90D050"/>
<!-- Edge bounce-light pops -->
<circle cx="11" cy="38" r="2" fill="#2A5A18"/>
<circle cx="27" cy="40" r="2" fill="#2A5A18"/>
<circle cx="15" cy="44" r="2" fill="#1E4410" opacity="0.8"/>
<circle cx="23" cy="43" r="2" fill="#1E4410" opacity="0.8"/>

<!-- ── BACK-CENTER TREE (smaller, behind house) -->
<circle cx="40" cy="15" r="5" fill="#1E4410"/>
<circle cx="37" cy="13" r="3" fill="#326618"/>
<circle cx="43" cy="14" r="3" fill="#326618"/>
<circle cx="40" cy="11" r="4" fill="#4A8A26"/>
<circle cx="39" cy="9"  r="3" fill="#5A9E30"/>
<circle cx="41" cy="10" r="2" fill="#6AB038"/>

<!-- ── BACK-LEFT SHRUBS (northwest corner) -->
<circle cx="11" cy="15" r="4" fill="#244A14"/>
<circle cx="10" cy="12" r="3" fill="#3A6E20"/>
<circle cx="13" cy="14" r="3" fill="#3A6E20"/>
<circle cx="11" cy="11" r="2" fill="#4A8226"/>

<!-- Small shrub near back-left garden bed -->
<circle cx="26" cy="13" r="3" fill="#2E621A"/>
<circle cx="25" cy="11" r="2" fill="#3E7222"/>

<!-- ── RIGHT-SIDE SHRUBS (near east fence, back area) -->
<circle cx="68" cy="26" r="3" fill="#244A14"/>
<circle cx="68" cy="24" r="2" fill="#3A6E20"/>
<circle cx="70" cy="25" r="2" fill="#3A6E20"/>

<!-- ── FRONT DOOR SHRUBS / PLANTERS (flanking porch entry) -->
<!-- Left shrub -->
<circle cx="33" cy="54" r="2" fill="#2A5E18" opacity="0.95"/>
<circle cx="33" cy="53" r="1" fill="#3A7222"/>
<!-- Left pot -->
<rect x="32" y="55" width="3" height="2" fill="#8A5A38"/>
<rect x="32" y="55" width="3" height="1" fill="#9A6A48"/>
<!-- Right shrub -->
<circle cx="47" cy="54" r="2" fill="#2A5E18" opacity="0.95"/>
<circle cx="47" cy="53" r="1" fill="#3A7222"/>
<!-- Right pot -->
<rect x="46" y="55" width="3" height="2" fill="#8A5A38"/>
<rect x="46" y="55" width="3" height="1" fill="#9A6A48"/>

<!-- ================================================================
     HOUSE ROOF  (top-down view, hip roof with shingle texture)
     House footprint: x=26-60, y=28-57
     Hip roof eaves overhang the footprint by ~2u on each side
     ================================================================ -->

<!-- Cast shadow (south + east edges, soft) -->
<rect x="26" y="57" width="34" height="2" fill="#5C4820" opacity="0.22"/>
<rect x="60" y="28" width="2" height="29" fill="#5C4820" opacity="0.18"/>

<!-- ── MAIN ROOF BODY ── -->
<rect x="26" y="28" width="34" height="29" fill="url(#shingles)"/>

<!-- Hip roof face shading — gives 3D top-down read -->
<!-- North face: lightest (lit from above-north light) -->
<polygon points="26,28 60,28 55,33 31,33" fill="#9898AC" opacity="0.45"/>
<!-- West face: mid-lit -->
<polygon points="26,28 26,57 31,52 31,33" fill="#808090" opacity="0.35"/>
<!-- South face: shadow (faces viewer / south light) -->
<polygon points="26,57 60,57 55,52 31,52" fill="#202030" opacity="0.42"/>
<!-- East face: shadow -->
<polygon points="60,28 60,57 55,52 55,33" fill="#202030" opacity="0.48"/>

<!-- Central roof plateau (flat or gently sloped top, between ridges) -->
<rect x="31" y="33" width="24" height="19" fill="#6E6E7E"/>

<!-- Ridge lines (raised peak seams) -->
<rect x="31" y="41" width="24" height="2" fill="#8E8EA0" opacity="0.65"/><!-- E–W ridge -->
<rect x="42" y="33" width="2" height="19" fill="#8E8EA0" opacity="0.5"/><!-- N–S ridge -->

<!-- Ridge cap highlight (very top of peak) -->
<rect x="43" y="34" width="1" height="17" fill="#A0A0B4" opacity="0.4"/>
<rect x="32" y="42" width="22" height="1" fill="#A0A0B4" opacity="0.35"/>

<!-- Chimney (brick, south-center of roof — visible from aerial) -->
<rect x="50" y="30" width="5" height="5" fill="#7A4838"/>
<rect x="50" y="30" width="5" height="1" fill="#9A6050"/><!-- top cap -->
<rect x="50" y="32" width="5" height="1" fill="#9A6050" opacity="0.5"/><!-- mortar -->
<!-- Chimney shadow -->
<rect x="55" y="30" width="1" height="5" fill="#28181C" opacity="0.4"/>
<rect x="50" y="35" width="6" height="1" fill="#28181C" opacity="0.3"/>

<!-- Roof vent / skylight detail -->
<rect x="36" y="36" width="5" height="4" fill="#4E4E5E"/>
<rect x="36" y="36" width="5" height="1" fill="#5E5E6E"/>

<!-- ── FRONT PORCH ROOF (south projection, smaller roof) -->
<rect x="36" y="53" width="8" height="5" fill="#626272"/>
<!-- Porch hip shadows -->
<polygon points="36,53 44,53 46,58 34,58" fill="#1C1C28" opacity="0.38"/>
<polygon points="36,53 36,58 39,56 39,54" fill="#787888" opacity="0.3"/><!-- west porch face lit -->

<!-- ================================================================
     MAILBOX (near street, front center)
     ================================================================ -->
<!-- Post -->
<rect x="39" y="64" width="2" height="5" fill="#64646E" opacity="0.9"/>
<!-- Box -->
<rect x="37" y="62" width="6" height="3" fill="#8A8A98"/>
<rect x="37" y="62" width="6" height="1" fill="#A0A0AE"/><!-- top -->
<!-- Flag (up = mail) -->
<rect x="42" y="61" width="1" height="3" fill="#64646E"/>
<rect x="43" y="61" width="3" height="2" fill="#C84040"/>

<!-- ================================================================
     COMPASS (bottom-right corner, subtle)
     ================================================================ -->
<rect x="67" y="65" width="10" height="10" fill="#0E0D1A" opacity="0.72" rx="1"/>
<text x="70.5" y="73" font-size="5" fill="#7070A0" font-family="monospace" font-weight="bold" opacity="0.7">N</text>
<polygon points="72,66 71,69 72,68.5 73,69" fill="#7070A0" opacity="0.6"/>
<line x1="72" y1="68.5" x2="72" y2="66" stroke="#7070A0" stroke-width="0.8" opacity="0.5"/>

<!-- ================================================================
     PROPERTY ADDRESS LABEL (top-left corner, subtle)
     ================================================================ -->
<rect x="8" y="60" width="22" height="7" fill="#0E0D1A" opacity="0.55" rx="1"/>
<text x="10" y="65" font-size="3.5" fill="#A090C0" font-family="monospace" opacity="0.65">225 CUSTER</text>
<text x="10" y="69" font-size="2.8" fill="#706880" font-family="monospace" opacity="0.5">COS · CO</text>

</svg>
</div>

<div class="caption">Pixel-art lot concept · spring · static v1 · not for production</div>

</body>
</html>
