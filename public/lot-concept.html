<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>225 Custer — Lot Concept v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0B0A18;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 24px;
      font-family: 'Courier New', monospace;
      color: #C0B8CC;
      overflow: hidden;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: 0.35;
    }

    /* The isometric transform lives here on a wrapper div.
       scaleY(0.5) collapses Y, rotate(45deg) tilts the diamond,
       then scaleX corrects the width so it reads as a square lot. */
    .iso-stage {
      position: relative;
      width: 600px;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The actual SVG sits inside and gets the iso transform */
    .iso-stage svg {
      transform: rotateX(60deg) rotateZ(-45deg);
      transform-style: preserve-3d;
      filter: drop-shadow(0 40px 60px rgba(0,0,0,0.7));
    }

    /* Elements that should pop ABOVE the lot plane (trees, house walls)
       use translateZ in an inner <g> — but for SVG we fake elevation
       with layering and shadows instead, keeping everything flat SVG. */

    .caption {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.20;
    }

    /* ── Animations ─────────────────────────────────────────────────── */

    /* Tree / tall plant sway — hinged at base */
    @keyframes sway {
      0%,100% { transform: rotate(0deg); }
      30%      { transform: rotate(1.8deg); }
      65%      { transform: rotate(-1.2deg); }
    }

    /* Slower sway for the big tree */
    @keyframes swayBig {
      0%,100% { transform: rotate(0deg); }
      25%      { transform: rotate(2.5deg); }
      60%      { transform: rotate(-1.8deg); }
    }

    /* Umbrella gentle pulse (subtle, like fabric catching breeze) */
    @keyframes umbrellaBreeze {
      0%,100% { transform: scale(1,1) rotate(0deg); }
      40%      { transform: scale(1.04,0.97) rotate(0.8deg); }
      70%      { transform: scale(0.97,1.02) rotate(-0.5deg); }
    }

    /* Bird flight path — crosses sky diagonally */
    @keyframes birdCross {
      0%   { transform: translate(-60px, 20px); opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { transform: translate(200px, -60px); opacity: 0; }
    }

    @keyframes birdCross2 {
      0%   { transform: translate(-40px, 50px); opacity: 0; }
      8%   { opacity: 0.8; }
      92%  { opacity: 0.8; }
      100% { transform: translate(180px, -40px); opacity: 0; }
    }

    /* Wing flap */
    @keyframes flap {
      0%,100% { d: path("M0,0 Q-3,-3 -6,0"); }
      50%      { d: path("M0,0 Q-3,1 -6,2"); }
    }

    /* Cloud drift — slow leftward float */
    @keyframes cloudDrift {
      0%   { transform: translateX(0px); }
      100% { transform: translateX(-80px); }
    }

    /* Mailbox flag gentle bob */
    @keyframes flagBob {
      0%,100% { transform: rotate(0deg); }
      50%      { transform: rotate(-8deg); }
    }

    /* Ambient shimmer on windows (faint light pulse) */
    @keyframes windowGlow {
      0%,100% { opacity: 0.6; }
      50%      { opacity: 0.85; }
    }

    /* Shadow pulse (subtle breathing of the lot) */
    @keyframes shadowPulse {
      0%,100% { opacity: 0.18; }
      50%      { opacity: 0.24; }
    }

    /* Chimney smoke puff */
    @keyframes puff {
      0%   { transform: translateY(0) scale(0.5); opacity: 0.6; }
      60%  { opacity: 0.3; }
      100% { transform: translateY(-12px) scale(1.6); opacity: 0; }
    }

    /* Leaf fall */
    @keyframes leafFall {
      0%   { transform: translate(0,0) rotate(0deg); opacity: 0.9; }
      100% { transform: translate(4px, 14px) rotate(120deg); opacity: 0; }
    }

    /* Sprout from ground */
    @keyframes sprout {
      from { transform: scaleY(0); opacity: 0; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    /* Patio umbrella slow rotate (barely perceptible, like wind spinning it) */
    @keyframes slowSpin {
      0%   { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(3deg) scale(1); }
    }

    /* Grass blade sway (gravel shimmer) */
    @keyframes gravel {
      0%,100% { opacity: 0.55; }
      50%      { opacity: 0.75; }
    }

    .tree-big { transform-origin: 19px 48px; animation: swayBig 7s ease-in-out infinite; }
    .tree-back { transform-origin: 40px 20px; animation: sway 5.5s ease-in-out infinite 1.2s; }
    .tree-shrub-l { transform-origin: 11px 19px; animation: sway 4.8s ease-in-out infinite 0.7s; }
    .tree-shrub-r { transform-origin: 68px 28px; animation: sway 5.2s ease-in-out infinite 1.8s; }

    .shrub-fl { transform-origin: 33px 56px; animation: sway 3.8s ease-in-out infinite 0.3s; }
    .shrub-fr { transform-origin: 47px 56px; animation: sway 4.2s ease-in-out infinite 1.1s; }

    .umbrella { transform-origin: 65px 17px; animation: umbrellaBreeze 6s ease-in-out infinite 0.5s; }

    .bird1 { animation: birdCross  18s linear infinite 2s; }
    .bird2 { animation: birdCross2 22s linear infinite 9s; }

    .cloud1 { animation: cloudDrift 55s linear infinite; }
    .cloud2 { animation: cloudDrift 70s linear infinite 15s; }

    .flag  { transform-origin: 42px 62px; animation: flagBob 4s ease-in-out infinite 1s; }

    .win-glow { animation: windowGlow 4s ease-in-out infinite; }

    .puff1 { animation: puff 5s ease-out infinite 0s; }
    .puff2 { animation: puff 5s ease-out infinite 2.5s; }

    .leaf1 { animation: leafFall 7s ease-in infinite 1s; }
    .leaf2 { animation: leafFall 8s ease-in infinite 4s; }
    .leaf3 { animation: leafFall 6s ease-in infinite 7s; }
  </style>
</head>
<body>

<div class="eyebrow">225 Custer Ave · Colorado Springs · Lot Concept v2 · Isometric</div>

<!--
  The isometric illusion is done entirely with CSS 3D transform on this SVG.
  rotateX(60deg) + rotateZ(-45deg) gives the classic 2:1 isometric dimetric look.
  The SVG itself is drawn as a flat 80×80 top-down map — CSS does the tilt.

  Orientation of the underlying flat map (before iso transform):
    North = top  (backyard / alley)
    South = bottom (street)
    The iso transform makes "north" recede and "south" face the viewer.

  All animations run on the flat map — they appear in iso space automatically.
-->

    <rect x="3" y="2" width="1" height="2" fill="#CEB87A" opacity="0.4"/>
    <rect x="0" y="3" width="2" height="1" fill="#A88C52" opacity="0.4"/>
    <rect x="2" y="1" width="1" height="2" fill="#D0BC80" opacity="0.3"/>

  <!-- Asphalt -->

    <rect width="4" height="3" fill="#36363E"/>

    <rect x="2" y="0" width="2" height="1" fill="#2C2C34" opacity="0.3"/>
  </pattern>

  <!-- Concrete paths -->

    <rect x="0" y="3" width="6" height="1" fill="#BAB8AC" opacity="0.5"/>
    <rect x="3" y="0" width="1" height="6" fill="#BAB8AC" opacity="0.35"/>
  </pattern>

  <!-- Roof shingles -->
  <pattern id="shingles" x="0" y="0" width="8" height="4" patternUnits="userSpaceOnUse">
    <rect width="8" height="4" fill="#686876"/>
    <rect x="0" y="0" width="4" height="2" fill="#747484" opacity="0.45"/>
    <rect x="4" y="2" width="4" height="2" fill="#747484" opacity="0.45"/>
    <rect x="0" y="2" width="8" height="1" fill="#565664" opacity="0.4"/>

  <!-- Mulch -->
  <pattern id="mulch" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="3" fill="#6A4A28"/>
    <rect x="1" y="0" width="2" height="1" fill="#7A5A32" opacity="0.5"/>
    <rect x="0" y="2" width="2" height="1" fill="#583A1C" opacity="0.5"/>
  </pattern>

  <!-- Subtle sky gradient -->

    <stop offset="0%" stop-color="#1A1830"/>
    <stop offset="100%" stop-color="#2A2848"/>
  </linearGradient>
</defs>
