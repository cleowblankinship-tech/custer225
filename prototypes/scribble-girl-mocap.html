<title>ScribbleGirl — mocap walk</title>

<!--
  ScribbleGirl, driven by real motion-capture
  -------------------------------------------
  60 frames of one seamless walk cycle (joint angles in degrees, extracted
  from video). The limbs are drawn fresh each frame as <line> elements between
  computed joint positions; only the head scribble is kept from the original
  SVG, placed at the head point and tilted with the torso.

  Conventions verified against the data
  - Angles are measured from vertical-DOWN. A segment at angle θ, length L, ends
    at  base + L·(sin θ, cos θ)  in SVG (y-down) space. So +θ swings toward +x.
  - At frame 7 the right thigh reads +18.7° (forward, +x) while the left reads
    -6.7° (back): a right-facing walk → direction = +1, no flip needed.
  - Knees and elbows are one-directional flexions; we SUBTRACT them from the
    parent segment angle so the shin/forearm tuck backward (KNEE_SIGN / ELBOW_SIGN
    expose this — flip if a joint hyperextends or she walks backward).

  Two data realities handled
  - The subject translates rightward across the clip. We anchor the hip at a
    fixed point (in-place treadmill) so the loop is seamless; only the small
    real vertical bob from hip_y is kept.
  - torso_angle is numerically degenerate at the loop boundary (the torso is
    near-vertical, so the raw angle spins). head/hip are smooth there, and
    atan2(head-hip) reproduces torso_angle on the stable frames — so we take the
    torso direction (and head tilt) from that vector instead of the raw column.

  Playback loops the 60 frames at 30fps, linearly interpolating between samples
  so it stays smooth at any rate. The scrubber steps the cycle frame-by-frame.
-->

const FRAMES = 60, FPS = 30;

/* ─────────────────────── tunable constants ────────────────────────── */
// Segment lengths in SVG units (viewBox is 200×411). Tune by eye.
const SEG = { torso: 96, thigh: 74, shin: 72, upperArm: 50, foreArm: 46, headGap: 24 };
const HIP = { x: 100, y: 250 };   // fixed anchor → in-place walk
const HEAD_SCALE = 0.60;          // shrink the original scribble
const BOB_GAIN = 2.2;             // amplify the (subtle) real vertical bob

// Knees/elbows are one-directional flexions subtracted from the parent angle so
// the shin/forearm fold backward. Flip a sign if a joint hyperextends.
let KNEE_SIGN = -1, ELBOW_SIGN = -1;
let direction = 1;                // +1 faces right (matches the source clip)

/* ─────────────────────── geometry helpers ─────────────────────────── */
const RAD = Math.PI / 180;
// A segment at angle θ (degrees, from vertical-DOWN) reaches base + L·(sinθ,cosθ).
const dir = (deg, L) => ({ x: L * Math.sin(deg * RAD), y: L * Math.cos(deg * RAD) });
const add = (p, d) => ({ x: p.x + d.x, y: p.y + d.y });

const hipYMean = D.hip_y.reduce((a, b) => a + b, 0) / FRAMES;

// Linear interpolation of every column at fractional frame f ∈ [0,60).
function sample(f) {
  f = ((f % FRAMES) + FRAMES) % FRAMES;
  const i = Math.floor(f), j = (i + 1) % FRAMES, t = f - i;
  const L = k => D[k][i] + (D[k][j] - D[k][i]) * t;
  return {
    thigh_l: L('thigh_l'), thigh_r: L('thigh_r'), knee_l: L('knee_l'), knee_r: L('knee_r'),
    arm_l: L('arm_l'), arm_r: L('arm_r'), elbow_l: L('elbow_l'), elbow_r: L('elbow_r'),
    head_x: L('head_x'), head_y: L('head_y'), hip_x: L('hip_x'), hip_y: L('hip_y'),
  };
}

// Build every joint position for a fractional frame.
function pose(f) {
  const s = sample(f);
  const bob = (s.hip_y - hipYMean) * 411 * BOB_GAIN;
  const hip = { x: HIP.x, y: HIP.y + bob };

  // Torso direction from the (smooth) head→hip vector — reproduces torso_angle
  // without the raw column's near-vertical degeneracy at the loop seam.
  const tAng = Math.atan2(s.head_x - s.hip_x, s.head_y - s.hip_y) / RAD; // from vertical-down
  const shoulder = add(hip, dir(tAng, SEG.torso));
  const headPt   = add(hip, dir(tAng, SEG.torso + SEG.headGap));

  const kneeL = add(hip, dir(s.thigh_l, SEG.thigh));
  const footL = add(kneeL, dir(s.thigh_l + KNEE_SIGN * s.knee_l, SEG.shin));
  const kneeR = add(hip, dir(s.thigh_r, SEG.thigh));
  const footR = add(kneeR, dir(s.thigh_r + KNEE_SIGN * s.knee_r, SEG.shin));

  const elbL  = add(shoulder, dir(s.arm_l, SEG.upperArm));
  const handL = add(elbL, dir(s.arm_l + ELBOW_SIGN * s.elbow_l, SEG.foreArm));
  const elbR  = add(shoulder, dir(s.arm_r, SEG.upperArm));
  const handR = add(elbR, dir(s.arm_r + ELBOW_SIGN * s.elbow_r, SEG.foreArm));

  return { hip, shoulder, headPt, tilt: tAng - 180, kneeL, footL, kneeR, footR, elbL, handL, elbR, handR };
}

/* ─────────────────────── render ───────────────────────────────────── */
const $ = id => document.getElementById(id);
const setLine = (el, a, b) => {
  el.setAttribute('x1', a.x.toFixed(2)); el.setAttribute('y1', a.y.toFixed(2));
  el.setAttribute('x2', b.x.toFixed(2)); el.setAttribute('y2', b.y.toFixed(2));
};
const dot = (el, p) => { el.setAttribute('cx', p.x.toFixed(2)); el.setAttribute('cy', p.y.toFixed(2)); };

// Centre of the original head scribble, so we can place it by its middle.
const headPath = $('head');
const headBB = headPath.getBBox();
const headCx = headBB.x + headBB.width / 2;
const headCy = headBB.y + headBB.height / 2;
const headGrp = $('head-grp');

function render(f) {
  const p = pose(f);
  setLine($('ln-torso'),   p.hip, p.shoulder);
  setLine($('ln-thigh-l'), p.hip, p.kneeL);   setLine($('ln-shin-l'), p.kneeL, p.footL);
  setLine($('ln-thigh-r'), p.hip, p.kneeR);   setLine($('ln-shin-r'), p.kneeR, p.footR);
  setLine($('ln-uparm-l'), p.shoulder, p.elbL); setLine($('ln-forearm-l'), p.elbL, p.handL);
  setLine($('ln-uparm-r'), p.shoulder, p.elbR); setLine($('ln-forearm-r'), p.elbR, p.handR);

  // Head scribble: place its centre at the head point, tilt with the torso.
  headGrp.setAttribute('transform',
    `translate(${p.headPt.x.toFixed(2)} ${p.headPt.y.toFixed(2)}) ` +
    `rotate(${p.tilt.toFixed(2)}) scale(${HEAD_SCALE}) translate(${-headCx} ${-headCy})`);

  dot($('j-hip'), p.hip); dot($('j-sh'), p.shoulder);
  dot($('j-kneeL'), p.kneeL); dot($('j-kneeR'), p.kneeR);
  dot($('j-elbL'), p.elbL); dot($('j-elbR'), p.elbR);
}

const facing = $('facing');
const applyFacing = () =>
  facing.setAttribute('transform', `translate(${HIP.x} 0) scale(${direction} 1) translate(${-HIP.x} 0)`);
applyFacing();

/* ─────────────────────── playback clock ───────────────────────────── */
const scrub = $('scrub'), frameRead = $('frame-read');
let playing = true, t0 = null;

function frameAt(elapsedMs) {
  if (t0 === null) t0 = elapsedMs;
  return ((elapsedMs - t0) / (1000 / FPS)) % FRAMES;   // 60 frames @ 30fps = 2s loop
}
function tick(elapsedMs) {
  let f;
  if (playing) { f = frameAt(elapsedMs); scrub.value = f.toFixed(1); }
  else { f = parseFloat(scrub.value) % FRAMES; }
  render(f);
  frameRead.textContent = (parseFloat(scrub.value) % FRAMES).toFixed(1);
}

(async () => {
  try {
    const { createTimer } = await import('https://cdn.jsdelivr.net/npm/animejs@4.0.2/+esm');
    createTimer({ duration: 1e12, onUpdate: self => tick(self.currentTime) });
  } catch (err) {
    console.warn('anime.js unavailable — using requestAnimationFrame fallback.', err);
    const start = performance.now();
    const loop = now => { tick(now - start); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();

/* ─────────────────────── controls ─────────────────────────────────── */
// Scrubbing pauses playback and drives the frame directly.
scrub.addEventListener('input', () => {
  playing = false;
  $('t-play').setAttribute('aria-pressed', 'false');
  $('t-play').textContent = '▶ play';
  render(parseFloat(scrub.value) % FRAMES);
  frameRead.textContent = (parseFloat(scrub.value) % FRAMES).toFixed(1);
});

// Live length tuning for the segment constants.
const SLIDERS = [
  ['torso', 40, 140], ['thigh', 40, 120], ['shin', 40, 120],
  ['upperArm', 20, 90], ['foreArm', 20, 90], ['headGap', 0, 60],
];
const host = $('sliders');
for (const [key, min, max] of SLIDERS) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${key}</label>` +
    `<input type="range" min="${min}" max="${max}" step="1" value="${SEG[key]}">` +
    `<output>${SEG[key]}</output>`;
  host.appendChild(row);
  const inp = row.querySelector('input'), out = row.querySelector('output');
  inp.addEventListener('input', () => { SEG[key] = +inp.value; out.textContent = inp.value; });
}

function toggle(id, fn, pressed = false) {
  const b = $(id); let s = pressed;
  const apply = () => { b.setAttribute('aria-pressed', String(s)); fn(s); };
  b.addEventListener('click', () => { s = !s; apply(); });
  apply();
}
toggle('t-play', s => {
  playing = s; $('t-play').textContent = s ? '▮▮ pause' : '▶ play';
  if (s) t0 = null;   // resync clock to current frame on resume
}, true);
toggle('t-dir',       s => { direction = s ? -1 : 1; applyFacing(); });
toggle('t-kneeSign',  s => { KNEE_SIGN = s ? 1 : -1; });
toggle('t-elbowSign', s => { ELBOW_SIGN = s ? 1 : -1; });
toggle('t-joints',    s => document.body.classList.toggle('show-joints', s));
</script>
