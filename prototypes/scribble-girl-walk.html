<title>ScribbleGirl — walk cycle</title>

<!--
  ScribbleGirl walk-cycle prototype
  ---------------------------------
  A hand-drawn stick figure rigged and animated as a loose, seamless walk.

  How the rig works
  - The six source paths are each a single unbroken limb whose FIRST `M`
    coordinate is its joint (shoulders/hips sit at the start, hands/feet at
    the end). We normalise their ids, then split arms + legs in code into an
    upper/lower pair nested as
        <g id="leg-l-upper"><path/><g id="leg-l-lower"><path/></g></g>
    so the lower segment inherits the upper's rotation and we can add a
    lagging knee/elbow bend on top.
  - Every rotating element uses `transform-box: fill-box` with an explicit
    per-element `transform-origin` placed exactly on its joint, so limbs
    pivot at the shoulder / hip / knee / elbow rather than the bbox corner.
  - The whole walk is driven from a single phase value, so it loops
    seamlessly. anime.js v4 is the clock (with a rAF fallback so the file
    still runs offline).

  Tuning
  - SPLIT_RATIOS and PARAMS at the top are meant to be tuned by eye.
  - The on-screen panel edits them live. "joints" shows the pivots + split
    points; "segments" colour-codes upper/lower. If a knee or elbow bends the
    wrong way (hyperextends), flip its sign toggle.
-->

<script type="module">
/* ───────────────────────── tunable constants ───────────────────────── */

// Where each limb breaks into upper/lower, measured from the joint (0) to
// the tip (1). Exposed so they can be tuned by eye.
const SPLIT_RATIOS = { leg: 0.55, arm: 0.50 };

// Source paths in document order → normalised ids.
const LIMB_ORDER = ['torso', 'arm-l', 'arm-r', 'head', 'leg-l', 'leg-r'];

// Walk parameters. All angles in degrees; period in ms. Live-editable below.
const PARAMS = {
  period:    980,   // ms for one full stride (both feet)
  thighAmp:  15,    // upper-leg swing
  kneeAmp:   24,    // lower-leg bend (one-directional)
  kneeLag:   0.11,  // knee trails the thigh by this fraction of a cycle
  armAmp:    17,    // upper-arm swing (counter to same-side leg)
  elbowAmp:  20,    // forearm bend (one-directional)
  elbowLag:  0.09,
  headAmp:   2.4,   // deliberately under-natural — the head reads as heavy
  torsoAmp:  2.0,   // gentle counter-sway of the trunk
  bobAmp:    5.0,   // vertical bob (runs at 2× stride frequency)
  overshoot: 0.12,  // 2nd-harmonic — gives the swing a loose overshoot
  asym:      0.06,  // small left/right amplitude imbalance
};

// One-directional bend signs. Knees may only fold backward, elbows only
// forward; if the default folds the wrong way, flip the sign (UI toggle).
const SIGNS = { knee: -1, elbow: 1 };

let direction = 1; // +1 faces right, -1 faces left (mirrored via scaleX)

const TWO_PI = Math.PI * 2;
const NS = 'http://www.w3.org/2000/svg';
const clamp01 = x => Math.max(0, x);

/* ───────────────────────── rig construction ────────────────────────── */

const svg     = document.getElementById('sg-svg');
const wrapper = document.getElementById('scribble-girl');
const jointsG = document.getElementById('joints');

// Normalise ids in document order (defensive — markup already uses them).
[...wrapper.querySelectorAll(':scope > path')].forEach((p, i) => {
  if (LIMB_ORDER[i]) p.id = LIMB_ORDER[i];
});

const debugDots = []; // {x, y, kind}

// Rotate `el` about the SVG-space point `pt`, using fill-box so the origin is
// relative to the element's own geometry bbox.
function pivotAt(el, pt) {
  const bb = el.getBBox();
  el.style.transformBox = 'fill-box';
  el.style.transformOrigin = `${pt.x - bb.x}px ${pt.y - bb.y}px`;
}

// Sample a sub-stretch of `path` (between arc-lengths a→b) as a polyline.
// Direction-agnostic: b may be less than a. At stroke-width 8 the straight
// segments are indistinguishable from the original curve.
function samplePath(path, a, b, step = 2) {
  const dir = b >= a ? 1 : -1;
  const pts = [];
  for (let s = a; dir > 0 ? s < b : s > b; s += dir * step) {
    const p = path.getPointAtLength(s);
    pts.push(p);
  }
  const end = path.getPointAtLength(b);
  pts.push(end);
  return pts.map((p, i) =>
    `${i ? 'L' : 'M'} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' ');
}

// Split one limb into nested upper/lower groups pivoting at joint and knee.
// The root (joint) end is verified rather than assumed: we take the endpoint
// nearer the body's top. For this asset that always equals the first `M`, but
// this keeps working if a limb were authored tip-to-joint.
function splitLimb(id, ratio) {
  const path = document.getElementById(id);
  const L = path.getTotalLength();
  const A = path.getPointAtLength(0);
  const B = path.getPointAtLength(L);
  const rootAtStart = A.y <= B.y;          // higher point = shoulder/hip

  const joint     = rootAtStart ? A : B;
  const rootLen   = rootAtStart ? 0 : L;
  const tipLen    = rootAtStart ? L : 0;
  const splitLen  = rootAtStart ? L * ratio : L * (1 - ratio);
  const knee      = path.getPointAtLength(splitLen);

  const upperD = samplePath(path, rootLen, splitLen);
  const lowerD = samplePath(path, splitLen, tipLen);

  const mk = (tag, attrs) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  const upperG = mk('g', { id: `${id}-upper` });
  const lowerG = mk('g', { id: `${id}-lower` });
  lowerG.appendChild(mk('path', { d: lowerD }));
  upperG.appendChild(mk('path', { d: upperD }));
  upperG.appendChild(lowerG);           // nest → lower inherits upper rotation
  path.replaceWith(upperG);

  pivotAt(upperG, joint);
  pivotAt(lowerG, knee);
  // NB: SVGPoint x/y are prototype accessors, not own properties — copy by hand.
  debugDots.push({ x: joint.x, y: joint.y, kind: 'joint' },
                 { x: knee.x,  y: knee.y,  kind: 'knee' });

  return { upperG, lowerG };
}

// Split the four limbs; head + torso stay single paths.
const legL = splitLimb('leg-l', SPLIT_RATIOS.leg);
const legR = splitLimb('leg-r', SPLIT_RATIOS.leg);
const armL = splitLimb('arm-l', SPLIT_RATIOS.arm);
const armR = splitLimb('arm-r', SPLIT_RATIOS.arm);

// Head + torso pivot at their own joint (first M / higher endpoint).
const headEl  = document.getElementById('head');
const torsoEl = document.getElementById('torso');
(() => {
  const hj = headEl.getPointAtLength(0);
  pivotAt(headEl, hj);
  debugDots.push({ x: hj.x, y: hj.y, kind: 'joint' });
  const tL = torsoEl.getTotalLength();
  const a = torsoEl.getPointAtLength(0), b = torsoEl.getPointAtLength(tL);
  const tj = a.y <= b.y ? a : b;
  pivotAt(torsoEl, tj);
  debugDots.push({ x: tj.x, y: tj.y, kind: 'joint' });
})();

// Wrapper flips + bobs around its own centre.
wrapper.style.transformBox = 'fill-box';
wrapper.style.transformOrigin = '50% 50%';

// Debug pivot markers.
for (const d of debugDots) {
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', d.x); c.setAttribute('cy', d.y);
  c.setAttribute('r', d.kind === 'joint' ? 4.5 : 3.5);
  c.setAttribute('fill', d.kind === 'joint' ? '#e0322b' : '#1f8ae0');
  c.setAttribute('stroke', 'white'); c.setAttribute('stroke-width', '1.2');
  jointsG.appendChild(c);
}

/* ───────────────────────── the walk itself ─────────────────────────── */

// Loose swing: a sine plus a small phase-shifted 2nd harmonic. The harmonic
// makes the limb overshoot slightly on the forward reach — hand-drawn, not
// mechanical — while staying perfectly periodic (seamless loop).
function swing(th, phase) {
  return Math.sin(th + phase) + PARAMS.overshoot * Math.sin(2 * (th + phase) + 0.6);
}

// One-directional secondary bend (knee/elbow), trailing the primary swing by
// `lag`. clamp01 keeps it folding one way only — no hyperextension.
function bend(th, phase, lag) {
  return clamp01(Math.sin(th + phase - TWO_PI * lag));
}

let phase = 0, lastT = null, running = true;

function tick(elapsedMs) {
  if (lastT === null) lastT = elapsedMs;
  const dt = elapsedMs - lastT;
  lastT = elapsedMs;
  if (!running) return;

  phase = (phase + dt / PARAMS.period) % 1;
  const th = phase * TWO_PI;

  // Legs: opposed by half a period. A touch of asymmetry L vs R.
  const thighL = PARAMS.thighAmp * (1 + PARAMS.asym) * swing(th, 0);
  const thighR = PARAMS.thighAmp * (1 - PARAMS.asym) * swing(th, Math.PI);
  const kneeL  = PARAMS.kneeAmp * SIGNS.knee * bend(th, 0, PARAMS.kneeLag);
  const kneeR  = PARAMS.kneeAmp * SIGNS.knee * bend(th, Math.PI, PARAMS.kneeLag);

  // Arms: counter the same-side leg, so arm-l opposes leg-l (and arm-l is
  // half a period off arm-r).
  const upperArmL = PARAMS.armAmp * swing(th, Math.PI);
  const upperArmR = PARAMS.armAmp * swing(th, 0);
  const elbowL    = PARAMS.elbowAmp * SIGNS.elbow * bend(th, Math.PI, PARAMS.elbowLag);
  const elbowR    = PARAMS.elbowAmp * SIGNS.elbow * bend(th, 0, PARAMS.elbowLag);

  // Head is heavy → understated. Torso counter-sways a hair.
  const head  = PARAMS.headAmp  * Math.sin(th);
  const torso = PARAMS.torsoAmp * Math.sin(th + Math.PI);

  // Vertical bob at 2× stride frequency.
  const yBob = -PARAMS.bobAmp * Math.cos(2 * th);

  legL.upperG.style.transform = `rotate(${thighL}deg)`;
  legL.lowerG.style.transform = `rotate(${kneeL}deg)`;
  legR.upperG.style.transform = `rotate(${thighR}deg)`;
  legR.lowerG.style.transform = `rotate(${kneeR}deg)`;
  armL.upperG.style.transform = `rotate(${upperArmL}deg)`;
  armL.lowerG.style.transform = `rotate(${elbowL}deg)`;
  armR.upperG.style.transform = `rotate(${upperArmR}deg)`;
  armR.lowerG.style.transform = `rotate(${elbowR}deg)`;
  headEl.style.transform  = `rotate(${head}deg)`;
  torsoEl.style.transform = `rotate(${torso}deg)`;
  wrapper.style.transform = `scaleX(${direction}) translateY(${yBob}px)`;
}

/* ── anime.js v4 as the clock (rAF fallback so the file runs offline) ── */
(async () => {
  try {
    const { createTimer } = await import('https://cdn.jsdelivr.net/npm/animejs@4.0.2/+esm');
    createTimer({ duration: 1e12, onUpdate: self => tick(self.currentTime) });
  } catch (err) {
    console.warn('anime.js unavailable — using requestAnimationFrame fallback.', err);
    const t0 = performance.now();
    const loop = now => { tick(now - t0); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();

/* ───────────────────────── control panel ───────────────────────────── */

const SLIDERS = [
  ['period',    400, 1800, 10],
  ['thighAmp',  0,   40,   1],
  ['kneeAmp',   0,   60,   1],
  ['kneeLag',   0,   0.35, 0.005],
  ['armAmp',    0,   40,   1],
  ['elbowAmp',  0,   50,   1],
  ['elbowLag',  0,   0.35, 0.005],
  ['headAmp',   0,   12,   0.2],
  ['torsoAmp',  0,   10,   0.2],
  ['bobAmp',    0,   16,   0.5],
  ['overshoot', 0,   0.4,  0.01],
  ['asym',      0,   0.3,  0.01],
];
const slidersHost = document.getElementById('sliders');
for (const [key, min, max, step] of SLIDERS) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML =
    `<label for="s-${key}">${key}</label>` +
    `<input id="s-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${PARAMS[key]}">` +
    `<output id="o-${key}">${PARAMS[key]}</output>`;
  slidersHost.appendChild(row);
  const input = row.querySelector('input');
  const out = row.querySelector('output');
  input.addEventListener('input', () => {
    PARAMS[key] = parseFloat(input.value);
    out.textContent = PARAMS[key];
  });
}

function toggle(btnId, onChange, pressed = false) {
  const b = document.getElementById(btnId);
  let state = pressed;
  const apply = () => { b.setAttribute('aria-pressed', String(state)); onChange(state); };
  b.addEventListener('click', () => { state = !state; apply(); });
  apply();
}
toggle('t-play',      s => { running = s; document.getElementById('t-play').textContent = s ? '▮▮ pause' : '▶ play'; }, true);
toggle('t-dir',       s => { direction = s ? -1 : 1; }, false);
toggle('t-kneeSign',  s => { SIGNS.knee  = s ? 1 : -1; }, false);
toggle('t-elbowSign', s => { SIGNS.elbow = s ? -1 : 1; }, false);
toggle('t-joints',    s => document.body.classList.toggle('show-joints', s), false);
toggle('t-segments',  s => document.body.classList.toggle('show-segments', s), false);
</script>
